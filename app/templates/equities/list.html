{% extends "base.html" %}
{% block title %}Equities · RSE Intelligence{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
  <div>
    <div class="page-title h4">Equities</div>
    <div class="page-subtitle">Latest approved closing data for listed securities.</div>
  </div>
  <input type="search" id="searchBox" class="form-control form-control-sm" style="width: 240px;" placeholder="Search symbol or name…">
</div>

<div class="card">
  <div class="table-responsive">
    <table class="table table-hover mb-0">
      <thead>
        <tr>
          <th>Symbol</th><th>Name</th><th class="text-end">12M High</th><th class="text-end">12M Low</th>
          <th class="text-end">Close</th><th class="text-end">Change</th><th class="text-end">Volume</th><th class="text-end">Turnover</th>
        </tr>
      </thead>
      <tbody id="equitiesBody">
        <tr><td colspan="8" class="text-center text-muted py-4">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/equities_list.js') }}"></script>
{% endblock %}
