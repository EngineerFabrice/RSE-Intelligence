{% extends "base.html" %}
{% block title %}{{ symbol }} · RSE Intelligence{% endblock %}
{% block content %}

<div id="app" data-symbol="{{ symbol }}">

<div class="page-title h4" id="titleBox">{{ symbol }}</div>
<div class="page-subtitle mb-3" id="subtitleBox">Loading…</div>

<div class="row g-3 mb-3" id="overviewCards"></div>

<div class="row g-3 mb-3">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>Price History</span>
        <div class="btn-group btn-group-sm" id="rangeSelector">
          <button class="btn btn-outline-secondary active" data-range="30">1M</button>
          <button class="btn btn-outline-secondary" data-range="90">3M</button>
          <button class="btn btn-outline-secondary" data-range="365">1Y</button>
          <button class="btn btn-outline-secondary" data-range="all">All</button>
        </div>
      </div>
      <div class="card-body"><canvas id="priceChart" height="110"></canvas></div>
    </div>
  </div>
  <div class="col-lg-4">
    <div class="card">
      <div class="card-header">Source</div>
      <div class="card-body small text-muted" id="sourceBox">—</div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-header">Trading History</div>
  <div class="table-responsive">
    <table class="table table-hover mb-0">
      <thead><tr><th>Date</th><th class="text-end">Close</th><th class="text-end">Change %</th><th class="text-end">Volume</th></tr></thead>
      <tbody id="historyBody"><tr><td colspan="4" class="text-center text-muted py-4">Loading…</td></tr></tbody>
    </table>
  </div>
</div>

</div>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/equity_detail.js') }}"></script>
{% endblock %}
